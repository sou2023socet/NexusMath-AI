<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reset Password</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        .container{
            width:400px;
            margin:80px auto;
            padding:30px;
            background:white;
            border-radius:10px;
            box-shadow:0 0 10px #ccc;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#1565c0;
            color:white;
            border:none;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <form
            action="/reset-password"
            method="post">

        <input
                type="hidden"
                name="token"
                th:value="${token}"/>

        <label>New Password</label>

        <input
                type="password"
                name="newPassword"
                required/>

        <label>Confirm Password</label>

        <input
                type="password"
                name="confirmPassword"
                required/>

        <button type="submit">

            Reset Password

        </button>

    </form>

</div>

</body>
</html>
