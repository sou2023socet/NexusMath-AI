server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://PROD_SERVER:3306/mathapp_auth
    username: PROD_USER
    password: PROD_PASSWORD

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: WARN
    com.mathapp: INFO

ai:
  chat:
    enabled: ${AI_CHAT_ENABLED:false}
    provider: ${AI_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout: ${AI_TIMEOUT:20s}