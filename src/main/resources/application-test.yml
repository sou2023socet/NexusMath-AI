server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mathapp_auth_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Password

  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO

ai:
  chat:
    enabled: ${AI_CHAT_ENABLED:false}
    provider: ${AI_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout: ${AI_TIMEOUT:20s}