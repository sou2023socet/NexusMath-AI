server:
  address: 0.0.0.0
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://database:3306/mathapp_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:mathapp}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    ttl-ms: ${AUTH_JWT_TTL_MS:86400000}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

ai:
  chat:
    enabled: ${AI_CHAT_ENABLED:false}
    provider: ${AI_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout: ${AI_TIMEOUT:20s}
